name: Build Smart Cattle Install-Fix APK

on:
  push:
    branches:
      - feature/abnormal-alert-popup-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build install-fix APK
        working-directory: android/SmartCattle
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean :app:assembleDebug

      - name: Verify APK alignment and signature
        working-directory: android/SmartCattle
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          test -s "$APK"

      - name: Verify and upload install-fix APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-cattle-install-fix-apk
          path: android/SmartCattle/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
